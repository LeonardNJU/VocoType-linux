server {
    listen 80;
    listen [::]:80;
    server_name feedback.vocotype-linux.lsamc.website;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feedback.vocotype-linux.lsamc.website;

    ssl_certificate /etc/letsencrypt/live/feedback.vocotype-linux.lsamc.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.vocotype-linux.lsamc.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 7m;
    client_body_timeout 20s;

    location = / {
        proxy_pass http://127.0.0.1:18088;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18088;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /v1/feedback {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18088;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location / {
        return 404;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
}
