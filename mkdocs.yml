# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: VoCoType Linux 文档
site_url: https://vocotype-linux.lsamc.website/docs/
site_description: VoCoType Linux 的安装、配置、输入法集成与排障文档。
repo_url: https://github.com/LeonardNJU/VocoType-linux
repo_name: LeonardNJU/VocoType-linux
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site/docs
strict: false

copyright: Copyright &copy; 2025–2026 Leonard Li · GNU GPL v3.0

theme:
  name: material
  language: zh
  favicon: https://vocotype-linux.lsamc.website/favicon.svg
  icon:
    logo: material/microphone-message
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - stylesheets/extra.css

extra:
  homepage: https://vocotype-linux.lsamc.website/zh.html
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LeonardNJU/VocoType-linux
      name: GitHub
    - icon: material/web
      link: https://vocotype-linux.lsamc.website/zh.html
      name: 项目主页

nav:
  - 首页: README.md
  - 快速上手:
      - 安装与首次配置: getting-started/installation.md
      - 图形设置中心: guides/settings-center.md
  - 输入法集成:
      - Fcitx 5: integrations/fcitx5.md
      - IBus: integrations/ibus.md
  - 功能指南:
      - 术语与原生热词: guides/terms.md
      - 逆文本标准化（ITN）: guides/itn.md
      - 实时识别预览: guides/asr-streaming.md
      - AI 润色与流式输出: guides/slm-streaming.md
      - 语音编辑兼容性与局限: guides/voice-editing.md
      - Rime 配置: guides/rime.md
  - 排障:
      - 常见问题: troubleshooting/faq.md
      - Fcitx 5 路径与服务: troubleshooting/fcitx5-paths.md
      - 休眠恢复: troubleshooting/hibernate.md
  - 开发:
      - 仓库目录规范: development/repository-layout.md
      - 打包与分发: development/packaging.md
      - 官方反馈服务: development/feedback-service.md
  - 项目主页: https://vocotype-linux.lsamc.website/zh.html
  - 最新进展: https://vocotype-linux.lsamc.website/zh-news.html
