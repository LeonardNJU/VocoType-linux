name: Publish v5.0.0 once

on:
  push:
    branches:
      - master
    paths:
      - VERSION
      - .github/release-notes/v5.0.0.md
      - .github/workflows/publish-v5.0.0.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    if: ${{ github.repository == 'LeonardNJU/VocoType-linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate stable release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "5.0.0"
          test -f .github/release-notes/v5.0.0.md
          ! git ls-remote --exit-code origin refs/tags/v5.0.0 >/dev/null 2>&1
      - name: Dispatch tested release build
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f version=v5.0.0 \
            -f publish=true

          run_id=
          for _ in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --event workflow_dispatch \
              --branch master \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .createdAt >= \"$dispatched_at\") | .databaseId" \
              | head -n1)
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || {
            echo "Could not locate the dispatched release workflow run" >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched release workflow run $run_id"
      - name: Wait for every release package and validation job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Publish the tested stable release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v5.0.0" --jq .id)
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

          gh release view v5.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,assets > release.json
          jq -e '.tagName == "v5.0.0" and .isDraft == false and .isPrerelease == false' release.json
          jq -e '.assets | length == 11' release.json
          cat release.json
      - name: Remove the one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin master
          rm .github/workflows/publish-v5.0.0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove one-shot v5.0.0 publisher"
          git push origin HEAD:master
