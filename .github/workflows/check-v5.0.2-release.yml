name: Check v5.0.2 release dispatch

on:
  push:
    branches: [master]
    paths:
      - '.github/release-dispatch/check-v5.0.2'

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Record latest canonical release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --event workflow_dispatch \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,createdAt,url,displayTitle \
            > .github/release-dispatch/status-v5.0.2.json
          test "$(jq length .github/release-dispatch/status-v5.0.2.json)" -gt 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/release-dispatch/status-v5.0.2.json
          git commit -m 'Record v5.0.2 release workflow status'
          git push
