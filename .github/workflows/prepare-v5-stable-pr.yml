name: Prepare V5 stable release from PR

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/prepare-v5-stable-pr.yml
      - .automation/prepare-v5-stable.py

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.head_ref == 'release/v5.0.0' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/v5.0.0
      - name: Prepare stable release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 .automation/prepare-v5-stable.py
          rm -f .automation/prepare-v5-stable.py
          rmdir .automation
          rm -f .github/workflows/prepare-v5-stable.yml
          rm -f .github/workflows/prepare-v5-stable-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "release: prepare v5.0.0"
          git push origin HEAD:release/v5.0.0
