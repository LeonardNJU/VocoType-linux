name: Delete non-master remote branches

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/audit-remote-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: ${{ github.head_ref == 'ops/branch-cleanup' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ops/branch-cleanup
      - name: Verify and delete every branch except master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune

          mapfile -t branches < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
              --jq '.[].name' | sort -u
          )

          for branch in "${branches[@]}"; do
            [[ "$branch" == "master" ]] && continue

            ref="origin/$branch"
            git show-ref --verify --quiet "refs/remotes/$ref" || {
              echo "Missing fetched ref for $branch" >&2
              exit 1
            }

            safe=false
            if git merge-base --is-ancestor "$ref" origin/master; then
              safe=true
            elif git diff --quiet origin/master "$ref" --; then
              safe=true
            elif [[ "$branch" == ops/* ]]; then
              safe=true
            else
              merged_prs=$(gh pr list \
                --state merged \
                --head "$branch" \
                --limit 1 \
                --json number \
                --jq 'length')
              [[ "$merged_prs" == "1" ]] && safe=true
            fi

            if [[ "$safe" != true ]]; then
              echo "Refusing to delete unverified branch: $branch" >&2
              exit 1
            fi
          done

          # Delete every other branch first. Delete this workflow's branch last.
          for branch in "${branches[@]}"; do
            [[ "$branch" == "master" || "$branch" == "ops/branch-cleanup" ]] && continue
            echo "Deleting $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done

          remaining=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          expected=$'master\nops/branch-cleanup'
          [[ "$remaining" == "$expected" ]] || {
            echo "Unexpected branches remain before final deletion:" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          }

          echo "Deleting ops/branch-cleanup"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ops/branch-cleanup"
