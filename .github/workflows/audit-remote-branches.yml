name: Audit remote branches

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/audit-remote-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    if: ${{ github.head_ref == 'ops/branch-cleanup' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ops/branch-cleanup
      - name: Summarize every remote branch against master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          def run(*args, check=True):
              p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and p.returncode:
                  raise SystemExit(f"command failed: {args}\n{p.stderr}")
              return p

          refs = run('git', 'for-each-ref', '--format=%(refname:short)', 'refs/remotes/origin').stdout.splitlines()
          rows = []
          for ref in sorted(refs):
              if ref in {'origin/HEAD', 'origin'}:
                  continue
              name = ref.removeprefix('origin/')
              sha = run('git', 'rev-parse', ref).stdout.strip()
              if name == 'master':
                  rows.append({'branch': name, 'sha': sha, 'keep': True})
                  continue
              behind, ahead = map(int, run('git', 'rev-list', '--left-right', '--count', f'origin/master...{ref}').stdout.split())
              ancestor = run('git', 'merge-base', '--is-ancestor', ref, 'origin/master', check=False).returncode == 0
              tree_equal = run('git', 'diff', '--quiet', 'origin/master', ref, '--', check=False).returncode == 0
              prs = json.loads(run('gh', 'pr', 'list', '--state', 'all', '--head', name, '--limit', '20', '--json', 'number,title,state,mergedAt,url').stdout or '[]')
              rows.append({
                  'branch': name,
                  'sha': sha,
                  'ahead': ahead,
                  'behind': behind,
                  'ancestor_of_master': ancestor,
                  'tree_equal_master': tree_equal,
                  'pull_requests': prs,
              })
          Path('remote-branch-summary.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')
          PY
          cat remote-branch-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add remote-branch-summary.json
          git commit -m "chore: summarize remote branch audit"
          git push origin HEAD:ops/branch-cleanup
