name: Prepare V5 stable release

on:
  push:
    branches:
      - release/v5.0.0
    paths:
      - .github/workflows/prepare-v5-stable.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/v5.0.0
      - name: Promote repository metadata to v5.0.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          version_path = root / 'VERSION'
          current = version_path.read_text().strip()
          if current != '5.0.0b5':
              raise SystemExit(f'unexpected VERSION: {current!r}')
          version_path.write_text('5.0.0\n')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text()
          old = '## [Unreleased]\n\n### Changed'
          new = '## [Unreleased]\n\n## [5.0.0] - 2026-08-02\n\n### Changed'
          if changelog.count(old) != 1:
              raise SystemExit('could not locate unique Unreleased changelog boundary')
          changelog_path.write_text(changelog.replace(old, new, 1))

          readme_path = root / 'README.md'
          readme = readme_path.read_text()
          start = readme.index('## 📰 V5 Beta 5')
          end = readme.index('<details>', start)
          stable_news = '''## 📰 VoCoType-linux V5 正式版

**[VoCoType-linux v5.0.0](https://github.com/LeonardNJU/VocoType-linux/releases/tag/v5.0.0)** 是 V5 原生架构的首个稳定版本，正式覆盖 Linux Fcitx 5、Linux IBus 与 Apple Silicon macOS。

- 本地 FunASR 最终识别、可选实时预览、热词、术语保护与 ITN 全部由共享 C++ Core 提供；
- `F9` 普通听写、`Shift+F9` AI 润色和 `Ctrl+F9` 语音编辑在三套前端保持一致语义；
- 按下语音快捷键时即并行准备最终 ASR、标点模型和当前热词图，显著降低冷启动后的松键等待；
- Fcitx 5 普通 F9 已改为异步、可取消任务：按 `Esc`、继续输入、开始新语音操作或输入框失焦都会立即取消等待；
- 设置中心的 AI“连接测试”明确为可选诊断；保存有效配置后可直接使用 AI 功能，无需每次启动后测试；
- 正式版安装资产包含 macOS arm64 DMG，以及 Debian、RPM、Arch 的 Universal、IBus-only、Fcitx5-only 软件包和统一校验和。

[前往 V5 正式版 Release 下载](https://github.com/LeonardNJU/VocoType-linux/releases/tag/v5.0.0)。macOS Apple Silicon 用户请选择 `VoCoType-linux-5.0.0-macOS-arm64.dmg`。

macOS 安装包目前仍采用 ad-hoc 签名、尚未经过 Apple notarization；首次打开可能需要在“系统设置 → 隐私与安全性”中选择“仍要打开”。

'''
          readme = readme[:start] + stable_news + readme[end:]
          replacements = {
              'v5.0.0-beta.5': 'v5.0.0',
              '5.0.0b5': '5.0.0',
              'V5 Beta 5 Release': 'V5 正式版 Release',
              'V5 Beta 5采用': 'V5 正式版仍采用',
              'V5 Beta 5': 'V5 正式版',
          }
          for old_text, new_text in replacements.items():
              readme = readme.replace(old_text, new_text)
          readme_path.write_text(readme)

          mac_path = root / 'docs/getting-started/macos.md'
          mac = mac_path.read_text()
          for old_text, new_text in {
              'VoCoType-linux-5.0.0b5-macOS-arm64.dmg': 'VoCoType-linux-5.0.0-macOS-arm64.dmg',
              'V5 Beta 5采用': 'V5 正式版仍采用',
              '后续 Beta更新': '后续版本更新',
              'V5 Beta 5在 Beta 4生命周期修复的基础上': 'V5 正式版在 Beta 4生命周期修复的基础上',
              '`5.0.0b5`': '`5.0.0`',
              'ad-hoc Beta升级后': 'ad-hoc版本升级后',
          }.items():
              if old_text not in mac:
                  raise SystemExit(f'missing macOS documentation text: {old_text}')
              mac = mac.replace(old_text, new_text)
          mac_path.write_text(mac)

          faq_path = root / 'docs/troubleshooting/faq.md'
          faq = faq_path.read_text()
          for old_text, new_text in {
              'V5 Beta 5采用': 'V5 正式版仍采用',
              'V5 Beta 5中': 'V5 正式版中',
              '`5.0.0b5`': '`5.0.0`',
          }.items():
              if old_text not in faq:
                  raise SystemExit(f'missing FAQ text: {old_text}')
              faq = faq.replace(old_text, new_text)
          faq_path.write_text(faq)

          for relative, label in [
              ('web/zh.html', 'V5 正式版'),
              ('web/zh-news.html', 'V5 正式版'),
              ('web/index.html', 'V5 Stable'),
          ]:
              path = root / relative
              text = path.read_text()
              text = text.replace('v5.0.0-beta.5', 'v5.0.0')
              text = text.replace('5.0.0b5', '5.0.0')
              text = text.replace('V5 Beta 5', label)
              path.write_text(text)

          notes = '''# VoCoType-linux v5.0.0

VoCoType-linux V5 正式版发布。这是全原生 C++ 架构的首个稳定版本，正式支持 Linux Fcitx 5、Linux IBus 与 Apple Silicon macOS，并将本地识别、实时预览、用户词典、ITN、AI 润色和语音编辑统一到同一套 Core 与协议中。

## 主要能力

- **系统级语音输入**：默认按住 `F9` 说话、松开上屏；可在浏览器、编辑器、聊天窗口和终端等普通文本框中使用。
- **本地最终识别**：FunASR Contextual Paraformer 在设备本地运行，无需 GPU；支持中英混合、原生热词、术语保护、标点和 ITN。
- **可选实时预览**：说话时显示流式识别结果，最终提交仍由完整录音的离线链路唯一决定。
- **AI 润色与语音编辑**：`Shift+F9` 可进行长句润色，`Ctrl+F9` 可根据输入框上下文执行替换、插入、删除、翻译、评论、导航、LaTeX 修改和撤销重做。
- **原生设置中心**：Linux 使用 GTK，macOS 使用 AppKit；覆盖安装、模型、音频、AI、用户词典、Playground、Doctor 与反馈。

## V5 稳定性与延迟改进

- 按下语音快捷键时立即在后台准备最终 ASR、标点模型和当前热词图，录音与模型冷启动并行进行；
- 离线 worker 空闲卸载窗口延长到 5 分钟，录音期间持续续租，避免长语音中途卸载；
- Fcitx 5 普通 F9 使用异步 `transcribe_start` / poll / cancel 任务协议，不再依赖固定 15 秒的阻塞 socket 等待；
- 按 `Esc`、继续输入、开始新的语音操作或输入框失焦时立即取消等待，迟到结果会被 task/session 校验丢弃；
- 设置中心的 AI“连接测试”是可选诊断，会真实发送一次模型请求；保存有效配置后无需先测试即可直接使用 AI 功能；
- 修复设置中心桌面启动器的项目根目录解析，以及 macOS、IBus、Fcitx 5 和 Universal 路径上的冷启动、热词准备与生命周期问题。

## 下载资产

- macOS Apple Silicon：`VoCoType-linux-5.0.0-macOS-arm64.dmg`；
- Debian / Ubuntu：Universal、IBus-only、Fcitx5-only；
- Fedora / RHEL：Universal、IBus-only、Fcitx5-only；
- Arch Linux：Universal、IBus-only、Fcitx5-only；
- 所有安装资产的统一 `SHA256SUMS`。

## macOS 签名说明

当前 DMG 采用 ad-hoc 签名，尚未经过 Apple notarization。首次打开若被 Gatekeeper 阻止，请先尝试打开一次，然后进入 **系统设置 → 隐私与安全性 → 仍要打开**。这是为该 App 建立本机安全例外，不是导入或信任一张 ad-hoc 证书。

## 升级

- Linux：直接使用对应发行版的新软件包覆盖安装；配置、用户词典和模型缓存会保留。
- macOS：将新 App 覆盖到 `/Applications` 后启动一次，外层 App 会自动升级 `~/Library/Input Methods` 中的输入法组件并保留用户数据。

**Full Changelog**: https://github.com/LeonardNJU/VocoType-linux/compare/v5.0.0-beta.5...v5.0.0
'''
          notes_path = root / '.github/release-notes/v5.0.0.md'
          if notes_path.exists():
              raise SystemExit('stable release notes already exist')
          notes_path.write_text(notes)
          PY

          rm .github/workflows/prepare-v5-stable.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "release: prepare v5.0.0"
          git push origin HEAD:release/v5.0.0
