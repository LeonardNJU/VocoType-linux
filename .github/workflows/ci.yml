name: Test and build packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocotype-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ripgrep libfcitx5core-dev nlohmann-json3-dev \
            libgtk-3-dev libyaml-cpp-dev libcurl4-openssl-dev libssl-dev \
            libportaudio2 portaudio19-dev libsqlite3-dev libboost-dev
      - name: Run native test suite
        run: make test

  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config ripgrep libfcitx5core-dev nlohmann-json3-dev \
            libgtk-3-dev libyaml-cpp-dev libcurl4-openssl-dev libssl-dev \
            libportaudio2 portaudio19-dev
      - name: Validate scripts and metadata
        run: |
          find ibus/scripts fcitx5/scripts installers packaging/tools packaging/tests tools/diagnostics \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          tests/native-contracts.sh
      - name: Build source/development staged tree
        run: |
          packaging/tools/stage-system-package.sh \
            --destdir "$RUNNER_TEMP/vocotype-stage" \
            --build-dir "$RUNNER_TEMP/fcitx-build" \
            --flavor fcitx5 \
            --skip-streaming-bundle
      - name: Build source release
        run: packaging/tools/build-source-release.sh
      - name: Validate source release
        run: packaging/tools/validate-source-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vocotype-release-preview
          path: dist/release/
          if-no-files-found: error

  native-streaming:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake curl git patch pkg-config \
            nlohmann-json3-dev libcurl4-openssl-dev binutils
      - name: Build and audit portable native runtime
        run: packaging/tools/build-native-streaming-release.sh dist/native
      - uses: actions/upload-artifact@v7
        with:
          name: ci-native-streaming-linux-x86_64
          path: dist/native/*
          if-no-files-found: error
          compression-level: 0

  deb:
    needs: native-streaming
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: ci-native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Install native package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper cmake pkg-config \
            libfcitx5core-dev nlohmann-json3-dev libibus-1.0-dev librime-dev \
            libgtk-3-dev libyaml-cpp-dev libcurl4-openssl-dev libssl-dev \
            ibus fcitx5 librime-bin librime-data rime-data-luna-pinyin \
            libportaudio2 portaudio19-dev policykit-1 dbus-daemon \
            meson ninja-build
      - name: Unpack audited native runtime
        run: |
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          test -n "$archive"
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
      - name: Build all Debian package flavors
        env:
          VOCOTYPE_STREAMING_BUNDLE_DIR: ${{ runner.temp }}/native-bundle
        run: |
          for flavor in universal ibus fcitx5; do
            packaging/tools/build-deb.sh dist/packages "$flavor"
          done
      - name: Install and validate every Debian flavor
        run: |
          . packaging/tools/package-common.sh
          version=$(vocotype_version "$PWD")
          debian_version=$(vocotype_version_field "$version" debian)
          for flavor in universal ibus fcitx5; do
            package_name=$(vocotype_flavor_field "$flavor" package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}_${debian_version}-*_amd64.deb" -print -quit)
            test -n "$package"
            packaging/tests/audit-built-package.sh "$package" "$version" "$flavor"
            sudo apt-get install -y "$(realpath "$package")"
            sudo packaging/tests/smoke-installed-package.sh "$version" "$flavor"
            sudo env PATH="$PATH" packaging/tests/smoke-binary-runtime.sh
            sudo apt-get purge -y "$package_name"
            sudo packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: |
            dist/packages/*.deb
            dist/packages/*.changes
            dist/packages/*.buildinfo
          if-no-files-found: error
          compression-level: 0

  rpm:
    needs: native-streaming
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install native package build dependencies
        run: |
          dnf install -y \
            git rpm-build cmake gcc gcc-c++ \
            pkgconf-pkg-config fcitx5-devel nlohmann-json-devel ibus-devel librime-devel \
            systemd-rpm-macros gtk3 gtk3-devel ibus fcitx5 \
            librime librime-tools brise yaml-cpp yaml-cpp-devel \
            libcurl-devel openssl-devel portaudio portaudio-devel polkit dbus-daemon \
            meson ninja-build binutils cpio
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v5
        with:
          name: ci-native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Unpack audited native runtime
        run: |
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          test -n "$archive"
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
      - name: Build all RPM flavors
        env:
          VOCOTYPE_STREAMING_BUNDLE_DIR: ${{ runner.temp }}/native-bundle
        run: |
          for flavor in universal ibus fcitx5; do
            packaging/tools/build-rpm.sh dist/packages "$flavor"
          done
      - name: Install and validate every RPM flavor
        run: packaging/tests/validate-rpm-flavors.sh dist/packages
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/packages/*.rpm
          if-no-files-found: error
          compression-level: 0

  arch:
    needs: native-streaming
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install native package build dependencies
        run: |
          pacman -Syu --noconfirm \
            git cmake gcc pkgconf fcitx5 nlohmann-json \
            gtk3 ibus librime librime-data yaml-cpp curl openssl \
            portaudio polkit dbus meson ninja binutils
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: ci-native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Unpack audited native runtime
        run: |
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          test -n "$archive"
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
      - name: Build all Arch package flavors
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-bundle"
          for flavor in universal ibus fcitx5; do
            su builder -c "cd '$GITHUB_WORKSPACE' && \
              VOCOTYPE_STREAMING_BUNDLE_DIR='$RUNNER_TEMP/native-bundle' \
              packaging/tools/build-arch.sh dist/packages '$flavor'"
          done
      - name: Install and validate every Arch flavor
        run: |
          . packaging/tools/package-common.sh
          version=$(vocotype_version "$PWD")
          arch_version=$(vocotype_version_field "$version" arch)
          for flavor in universal ibus fcitx5; do
            package_name=$(vocotype_flavor_field "$flavor" package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}-${arch_version}-*.pkg.tar.*" ! -name '*debug*' -print -quit)
            test -n "$package"
            packaging/tests/audit-built-package.sh "$package" "$version" "$flavor"
            pacman -U --noconfirm "$package"
            packaging/tests/smoke-installed-package.sh "$version" "$flavor"
            packaging/tests/smoke-binary-runtime.sh
            pacman -Rns --noconfirm "$package_name"
            packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/packages/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0
