name: Test and build packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocotype-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 portaudio19-dev libcairo2-dev \
            libgirepository1.0-dev gir1.2-gtk-3.0 pkg-config \
            cmake g++ libfcitx5core-dev nlohmann-json3-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app settings_center ibus fcitx5/backend installers packaging/tools tools tests

  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libfcitx5core-dev nlohmann-json3-dev
          python -m pip install build twine pytest pyyaml
      - name: Validate scripts and metadata
        run: |
          find ibus/scripts fcitx5/scripts installers packaging/tools packaging/tests tools/diagnostics \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python -m pytest -q tests/test_release_packaging.py
      - name: Build source/development staged tree
        run: |
          packaging/tools/stage-system-package.sh \
            --destdir "$RUNNER_TEMP/vocotype-stage" \
            --build-dir "$RUNNER_TEMP/fcitx-build" \
            --skip-streaming-bundle --skip-wheelhouse
      - name: Build Python and source distributions
        run: python packaging/tools/build-release.py
      - name: Validate distributions
        run: |
          python -m twine check dist/release/python/*
          python packaging/tools/validate-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: vocotype-release-preview
          path: dist/release/
          if-no-files-found: error

  native-streaming:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake curl git patch pkg-config \
            nlohmann-json3-dev binutils
      - name: Build and audit portable native runtime
        run: packaging/tools/build-native-streaming-release.sh dist/native
      - uses: actions/upload-artifact@v7
        with:
          name: ci-native-streaming-linux-x86_64
          path: dist/native/*
          if-no-files-found: error
          compression-level: 0

  deb:
    needs: native-streaming
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: ci-native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Install build and wheel dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper cmake pkg-config \
            libfcitx5core-dev nlohmann-json3-dev \
            libgirepository1.0-dev libcairo2-dev libglib2.0-dev libffi-dev \
            python3-gi gir1.2-gtk-3.0 ibus fcitx5 \
            libportaudio2 portaudio19-dev policykit-1 dbus-daemon \
            meson ninja-build
          python -m pip install --upgrade pip
          python -m pip install uv wheel
      - name: Prepare complete package inputs
        env:
          VOCOTYPE_WHEELHOUSE_PYTHON: python
          VOCOTYPE_PYGOBJECT_SPEC: PyGObject>=3.46,<3.52
        run: |
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
          packaging/tools/build-runtime-wheelhouse.sh "$RUNNER_TEMP/wheelhouse"
      - name: Build all Debian package flavors
        env:
          VOCOTYPE_STREAMING_BUNDLE_DIR: ${{ runner.temp }}/native-bundle
          VOCOTYPE_WHEELHOUSE_DIR: ${{ runner.temp }}/wheelhouse
        run: |
          for flavor in universal ibus fcitx5; do
            packaging/tools/build-deb.sh dist/packages "$flavor"
          done
      - name: Install and validate every Debian flavor
        run: |
          version=$(python3 packaging/tools/versioning.py "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' vocotype_version.py)")
          debian_version=$(python3 packaging/tools/versioning.py "$version" --field debian)
          for flavor in universal ibus fcitx5; do
            package_name=$(python3 packaging/tools/package-flavor.py "$flavor" --field package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}_${debian_version}-*_amd64.deb" -print -quit)
            test -n "$package"
            sudo apt-get install -y "$(realpath "$package")"
            sudo packaging/tests/smoke-installed-package.sh "$version" "$flavor"
            sudo env PATH="$PATH" packaging/tests/smoke-binary-runtime.sh
            sudo apt-get purge -y "$package_name"
            sudo packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: |
            dist/packages/*.deb
            dist/packages/*.changes
            dist/packages/*.buildinfo
          if-no-files-found: error
          compression-level: 0

  rpm:
    needs: native-streaming
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build and wheel dependencies
        run: |
          dnf install -y \
            git python3 python3-pip rpm-build cmake gcc gcc-c++ \
            pkgconf-pkg-config fcitx5-devel nlohmann-json-devel \
            systemd-rpm-macros python3-gobject gtk3 ibus fcitx5 \
            portaudio portaudio-devel polkit dbus-daemon \
            glib2-devel gobject-introspection-devel cairo-gobject-devel libffi-devel \
            meson ninja-build binutils
          python3 -m pip install --break-system-packages uv
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v5
        with:
          name: ci-native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Prepare complete package inputs
        env:
          VOCOTYPE_PYGOBJECT_SPEC: PyGObject>=3.56
        run: |
          uv python install 3.12
          uv venv --python 3.12 --seed "$RUNNER_TEMP/wheel-builder"
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
          VOCOTYPE_WHEELHOUSE_PYTHON="$RUNNER_TEMP/wheel-builder/bin/python" \
            packaging/tools/build-runtime-wheelhouse.sh "$RUNNER_TEMP/wheelhouse"
      - name: Build all RPM flavors
        env:
          VOCOTYPE_STREAMING_BUNDLE_DIR: ${{ runner.temp }}/native-bundle
          VOCOTYPE_WHEELHOUSE_DIR: ${{ runner.temp }}/wheelhouse
        run: |
          for flavor in universal ibus fcitx5; do
            packaging/tools/build-rpm.sh dist/packages "$flavor"
          done
      - name: Install and validate every RPM flavor
        run: |
          version=$(python3 packaging/tools/versioning.py "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' vocotype_version.py)")
          rpm_version=$(python3 packaging/tools/versioning.py "$version" --field rpm_version)
          rpm_release=$(python3 packaging/tools/versioning.py "$version" --field rpm_release)
          for flavor in universal ibus fcitx5; do
            package_name=$(python3 packaging/tools/package-flavor.py "$flavor" --field package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}-${rpm_version}-${rpm_release}*.x86_64.rpm" ! -name '*debug*' -print -quit)
            test -n "$package"
            dnf install -y "$package"
            packaging/tests/smoke-installed-package.sh "$version" "$flavor"
            packaging/tests/smoke-binary-runtime.sh
            dnf remove -y "$package_name"
            packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/packages/*.rpm
          if-no-files-found: error
          compression-level: 0

  arch:
    needs: native-streaming
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build and wheel dependencies
        run: |
          pacman -Syu --noconfirm \
            git python python-pip cmake gcc pkgconf fcitx5 nlohmann-json \
            python-gobject gtk3 ibus portaudio polkit dbus \
            glib2-devel gobject-introspection cairo libffi meson ninja binutils
          python -m pip install --break-system-packages uv
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: ci-native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Prepare complete package inputs
        env:
          VOCOTYPE_PYGOBJECT_SPEC: PyGObject>=3.56
        run: |
          uv python install 3.12
          uv venv --python 3.12 --seed "$RUNNER_TEMP/wheel-builder"
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
          VOCOTYPE_WHEELHOUSE_PYTHON="$RUNNER_TEMP/wheel-builder/bin/python" \
            packaging/tools/build-runtime-wheelhouse.sh "$RUNNER_TEMP/wheelhouse"
      - name: Build all Arch package flavors
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-bundle" "$RUNNER_TEMP/wheelhouse"
          for flavor in universal ibus fcitx5; do
            su builder -c "cd '$GITHUB_WORKSPACE' && \
              VOCOTYPE_STREAMING_BUNDLE_DIR='$RUNNER_TEMP/native-bundle' \
              VOCOTYPE_WHEELHOUSE_DIR='$RUNNER_TEMP/wheelhouse' \
              packaging/tools/build-arch.sh dist/packages '$flavor'"
          done
      - name: Install and validate every Arch flavor
        run: |
          version=$(python3 packaging/tools/versioning.py "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' vocotype_version.py)")
          arch_version=$(python3 packaging/tools/versioning.py "$version" --field arch)
          for flavor in universal ibus fcitx5; do
            package_name=$(python3 packaging/tools/package-flavor.py "$flavor" --field package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}-${arch_version}-*.pkg.tar.*" ! -name '*debug*' -print -quit)
            test -n "$package"
            pacman -U --noconfirm "$package"
            packaging/tests/smoke-installed-package.sh "$version" "$flavor"
            packaging/tests/smoke-binary-runtime.sh
            pacman -Rns --noconfirm "$package_name"
            packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/packages/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0
