name: Test and build packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libcairo2-dev libgirepository1.0-dev gir1.2-gtk-3.0 pkg-config cmake g++ libfcitx5core-dev nlohmann-json3-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app settings_center ibus fcitx5/backend installers packaging/tools tools tests

  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libfcitx5core-dev nlohmann-json3-dev
          python -m pip install build twine pytest pyyaml
      - name: Validate scripts and metadata
        run: |
          find ibus/scripts fcitx5/scripts installers packaging/tools packaging/tests tools/diagnostics \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python -m pytest -q tests/test_release_packaging.py
      - name: Build staged system tree
        run: packaging/tools/stage-system-package.sh --destdir "$RUNNER_TEMP/vocotype-stage" --build-dir "$RUNNER_TEMP/fcitx-build"
      - name: Build Python and source distributions
        run: python packaging/tools/build-release.py
      - name: Validate distributions
        run: |
          python -m twine check dist/release/python/*
          python packaging/tools/validate-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: vocotype-release-preview
          path: dist/release/
          if-no-files-found: error

  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper cmake pkg-config libfcitx5core-dev nlohmann-json3-dev
      - name: Build Debian package
        run: packaging/tools/build-deb.sh
      - name: Install and validate Debian package
        run: |
          package=$(find dist/packages -maxdepth 1 -name 'vocotype-linux_*.deb' -print -quit)
          test -n "$package"
          sudo apt-get install -y "$(realpath "$package")"
          sudo packaging/tests/smoke-installed-package.sh "$(python3 -c 'from vocotype_version import __version__; print(__version__)')"
          sudo apt-get purge -y vocotype-linux
          sudo packaging/tests/smoke-removed-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: |
            dist/packages/*.deb
            dist/packages/*.changes
            dist/packages/*.buildinfo
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf install -y git rpm-build cmake gcc-c++ pkgconf-pkg-config fcitx5-devel nlohmann-json-devel systemd-rpm-macros dbus-daemon
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build RPM
        run: packaging/tools/build-rpm.sh
      - name: Install and validate RPM
        run: |
          package=$(find dist/packages -maxdepth 1 -name 'vocotype-linux-*.x86_64.rpm' ! -name '*debug*' -print -quit)
          test -n "$package"
          dnf install -y "$package"
          packaging/tests/smoke-installed-package.sh "$(python3 -c 'from vocotype_version import __version__; print(__version__)')"
          dnf remove -y vocotype-linux
          packaging/tests/smoke-removed-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/packages/*.rpm
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git cmake gcc pkgconf fcitx5 nlohmann-json
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && packaging/tools/build-arch.sh"
      - name: Install and validate Arch package
        run: |
          package=$(find dist/packages -maxdepth 1 -name 'vocotype-linux-*.pkg.tar.*' ! -name '*debug*' -print -quit)
          test -n "$package"
          pacman -U --noconfirm "$package"
          packaging/tests/smoke-installed-package.sh "$(python3 -c 'from vocotype_version import __version__; print(__version__)')"
          pacman -Rns --noconfirm vocotype-linux
          packaging/tests/smoke-removed-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/packages/*.pkg.tar.*
          if-no-files-found: error
