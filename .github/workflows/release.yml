name: Build release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected tag or version, such as v3.0.0-beta.1
        required: true
        type: string
      publish:
        description: Create the tag and GitHub Release only after every package passes
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vocotype-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        name: Validate repository version and tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . packaging/tools/package-common.sh
          version=$(vocotype_version "$PWD")
          tag=$(vocotype_version_field "$version" tag)
          prerelease=$(vocotype_version_field "$version" prerelease)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match repository version $tag" >&2
            exit 1
          fi
          if [[ -n "$INPUT_VERSION" ]]; then
            expected=${INPUT_VERSION#v}; expected=${expected/-beta./b}; expected=${expected/-rc./rc}
            [[ "$expected" == "$version" ]] || {
              echo "Requested version $expected does not match $version" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  native-streaming:
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake curl git patch pkg-config \
            nlohmann-json3-dev libcurl4-openssl-dev binutils
      - name: Build and audit portable native streaming runtime
        run: packaging/tools/build-native-streaming-release.sh dist/native
      - uses: actions/upload-artifact@v7
        with:
          name: native-streaming-linux-x86_64
          path: dist/native/*
          if-no-files-found: error
          compression-level: 0

  source-deb:
    needs: [validate-version, native-streaming]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Install DEB native build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper cmake pkg-config \
            libfcitx5core-dev nlohmann-json3-dev libibus-1.0-dev librime-dev \
            libgtk-3-dev libyaml-cpp-dev libcurl4-openssl-dev libssl-dev \
            ibus fcitx5 librime-bin librime-data rime-data-luna-pinyin \
            libportaudio2 portaudio19-dev policykit-1 dbus-daemon \
            meson ninja-build
      - name: Unpack audited native runtime
        run: |
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          test -n "$archive"
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
      - name: Build and validate source release metadata
        run: |
          packaging/tools/build-source-release.sh \
            --expected-version "${{ needs.validate-version.outputs.version }}"
          packaging/tools/validate-source-release.sh \
            --expected-version "${{ needs.validate-version.outputs.version }}" \
            --expected-commit "$GITHUB_SHA"
      - name: Build all complete Debian flavors
        env:
          VOCOTYPE_STREAMING_BUNDLE_DIR: ${{ runner.temp }}/native-bundle
        run: |
          for flavor in universal ibus fcitx5; do
            packaging/tools/build-deb.sh dist/packages "$flavor"
          done
      - name: Install and validate every Debian flavor
        run: |
          . packaging/tools/package-common.sh
          debian_version=$(vocotype_version_field "${{ needs.validate-version.outputs.version }}" debian)
          for flavor in universal ibus fcitx5; do
            package_name=$(vocotype_flavor_field "$flavor" package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}_${debian_version}-*_amd64.deb" -print -quit)
            test -n "$package"
            packaging/tests/audit-built-package.sh "$package" "${{ needs.validate-version.outputs.version }}" "$flavor"
            sudo apt-get install -y "$(realpath "$package")"
            sudo packaging/tests/smoke-installed-package.sh "${{ needs.validate-version.outputs.version }}" "$flavor"
            sudo env PATH="$PATH" packaging/tests/smoke-binary-runtime.sh
            sudo apt-get purge -y "$package_name"
            sudo packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: source-deb
          path: |
            dist/release/
            dist/packages/*.deb
            dist/packages/*.changes
            dist/packages/*.buildinfo
          if-no-files-found: error
          compression-level: 0

  rpm:
    needs: [validate-version, native-streaming]
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install RPM native build and smoke-test tools
        run: |
          dnf install -y \
            git rpm-build cmake gcc gcc-c++ \
            pkgconf-pkg-config fcitx5-devel nlohmann-json-devel ibus-devel librime-devel \
            systemd-rpm-macros gtk3 gtk3-devel ibus fcitx5 \
            librime librime-tools brise yaml-cpp yaml-cpp-devel \
            libcurl-devel openssl-devel portaudio portaudio-devel polkit dbus-daemon \
            meson ninja-build binutils cpio
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v5
        with:
          name: native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Unpack audited native runtime
        run: |
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          test -n "$archive"
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
      - name: Build all complete RPM flavors
        env:
          VOCOTYPE_STREAMING_BUNDLE_DIR: ${{ runner.temp }}/native-bundle
        run: |
          for flavor in universal ibus fcitx5; do
            packaging/tools/build-rpm.sh dist/packages "$flavor"
          done
      - name: Install and validate every RPM flavor
        run: |
          . packaging/tools/package-common.sh
          rpm_version=$(vocotype_version_field "${{ needs.validate-version.outputs.version }}" rpm_version)
          rpm_release=$(vocotype_version_field "${{ needs.validate-version.outputs.version }}" rpm_release)
          for flavor in universal ibus fcitx5; do
            package_name=$(vocotype_flavor_field "$flavor" package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}-${rpm_version}-${rpm_release}*.x86_64.rpm" ! -name '*debug*' -print -quit)
            test -n "$package"
            packaging/tests/audit-built-package.sh "$package" "${{ needs.validate-version.outputs.version }}" "$flavor"
            dnf install -y "$package"
            packaging/tests/smoke-installed-package.sh "${{ needs.validate-version.outputs.version }}" "$flavor"
            packaging/tests/smoke-binary-runtime.sh
            dnf remove -y "$package_name"
            packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/packages/*.rpm
          if-no-files-found: error
          compression-level: 0

  arch:
    needs: [validate-version, native-streaming]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch native build and smoke-test tools
        run: |
          pacman -Syu --noconfirm \
            git cmake gcc pkgconf fcitx5 nlohmann-json \
            gtk3 ibus librime librime-data yaml-cpp curl openssl \
            portaudio polkit dbus meson ninja binutils
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: native-streaming-linux-x86_64
          path: ${{ runner.temp }}/native-artifact
      - name: Unpack audited native runtime
        run: |
          archive=$(find "$RUNNER_TEMP/native-artifact" -name 'vocotype-native-streaming-*.tar.gz' -print -quit)
          test -n "$archive"
          packaging/tools/unpack-native-streaming-release.sh "$archive" "$RUNNER_TEMP/native-bundle"
      - name: Build all complete Arch flavors as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-bundle"
          for flavor in universal ibus fcitx5; do
            su builder -c "cd '$GITHUB_WORKSPACE' && \
              VOCOTYPE_STREAMING_BUNDLE_DIR='$RUNNER_TEMP/native-bundle' \
              packaging/tools/build-arch.sh dist/packages '$flavor'"
          done
      - name: Install and validate every Arch flavor
        run: |
          . packaging/tools/package-common.sh
          arch_version=$(vocotype_version_field "${{ needs.validate-version.outputs.version }}" arch)
          for flavor in universal ibus fcitx5; do
            package_name=$(vocotype_flavor_field "$flavor" package_name)
            package=$(find dist/packages -maxdepth 1 -name "${package_name}-${arch_version}-*.pkg.tar.*" ! -name '*debug*' -print -quit)
            test -n "$package"
            packaging/tests/audit-built-package.sh "$package" "${{ needs.validate-version.outputs.version }}" "$flavor"
            pacman -U --noconfirm "$package"
            packaging/tests/smoke-installed-package.sh "${{ needs.validate-version.outputs.version }}" "$flavor"
            packaging/tests/smoke-binary-runtime.sh
            pacman -Rns --noconfirm "$package_name"
            packaging/tests/smoke-removed-package.sh
          done
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/packages/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0

  assemble:
    needs: [validate-version, native-streaming, source-deb, rpm, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Collect installer-only GitHub Release assets
        run: |
          packaging/tools/collect-release-assets.sh \
            assets final-assets --installers-only
      - name: Write installer checksums
        run: |
          (
            cd final-assets
            find . -maxdepth 1 -type f -print0 \
              | sort -z | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS
          )
      - name: Validate the exact downloadable asset set
        run: |
          packaging/tools/validate-final-release-assets.sh final-assets \
            --version "${{ needs.validate-version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: final-release-assets
          path: final-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: ${{ inputs.publish == true }}
    needs: [validate-version, assemble]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: final-release-assets
          path: final-assets
      - name: Revalidate the assembled downloadable assets
        run: |
          packaging/tools/validate-final-release-assets.sh final-assets \
            --version "${{ needs.validate-version.outputs.version }}"
      - name: Create tag and Release from the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          PRERELEASE: ${{ needs.validate-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG" >&2
            exit 1
          fi
          cleanup_failed_release() {
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
              >/dev/null 2>&1 || true
          }
          trap cleanup_failed_release ERR
          release_flags=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --latest=false
          )
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if [[ -f "$notes_file" ]]; then
            release_flags+=(--notes-file "$notes_file")
          else
            echo "No curated release notes found at $notes_file; falling back to GitHub-generated notes." >&2
            release_flags+=(--generate-notes)
          fi
          if [[ "$PRERELEASE" == true ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--draft)
          fi
          gh release create "$RELEASE_TAG" final-assets/* "${release_flags[@]}"
          trap - ERR
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url
