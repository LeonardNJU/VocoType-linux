name: Build release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Expected version, such as 2.2.3
        required: false

permissions:
  contents: write

jobs:
  source-python-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper cmake clang curl patch pkg-config libfcitx5core-dev nlohmann-json3-dev python3-gi gir1.2-gtk-3.0 ibus fcitx5 libportaudio2 policykit-1
          python -m pip install build twine
      - name: Build and validate release metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          expected="$INPUT_VERSION"
          if [[ -z "$expected" && "$GITHUB_REF_TYPE" == tag ]]; then
            expected="$GITHUB_REF_NAME"
          fi
          args=()
          [[ -n "$expected" ]] && args+=(--expected-version "$expected")
          python packaging/tools/build-release.py "${args[@]}"
      - name: Check Python metadata
        run: python -m twine check dist/release/python/*
      - name: Validate release artifact contract
        run: python packaging/tools/validate-release.py
      - name: Build Debian package
        run: packaging/tools/build-deb.sh
      - name: Install and validate Debian package
        run: |
          package=$(find dist/packages -maxdepth 1 -name 'vocotype-linux_*.deb' -print -quit)
          test -n "$package"
          sudo apt-get install -y "$(realpath "$package")"
          sudo packaging/tests/smoke-installed-package.sh "$(python3 -c 'from vocotype_version import __version__; print(__version__)')"
          sudo apt-get purge -y vocotype-linux
          sudo packaging/tests/smoke-removed-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: source-python-deb
          path: |
            dist/release/
            dist/packages/*.deb
            dist/packages/*.changes
            dist/packages/*.buildinfo
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install tools
        run: dnf install -y git python3.12 rpm-build cmake clang curl patch gcc-c++ pkgconf-pkg-config fcitx5-devel nlohmann-json-devel systemd-rpm-macros python3-gobject gtk3 ibus fcitx5 portaudio polkit dbus-daemon
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build RPM
        run: packaging/tools/build-rpm.sh
      - name: Install and validate RPM
        run: |
          package=$(find dist/packages -maxdepth 1 -name 'vocotype-linux-*.x86_64.rpm' ! -name '*debug*' -print -quit)
          test -n "$package"
          dnf install -y "$package"
          packaging/tests/smoke-installed-package.sh "$(python3 -c 'from vocotype_version import __version__; print(__version__)')"
          dnf remove -y vocotype-linux
          packaging/tests/smoke-removed-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/packages/*.rpm
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git python cmake clang curl patch gcc pkgconf fcitx5 nlohmann-json python-gobject gtk3 ibus portaudio polkit
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create unprivileged builder
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build Arch package
        run: su builder -c "cd '$GITHUB_WORKSPACE' && packaging/tools/build-arch.sh"
      - name: Install and validate Arch package
        run: |
          package=$(find dist/packages -maxdepth 1 -name 'vocotype-linux-*.pkg.tar.*' ! -name '*debug*' -print -quit)
          test -n "$package"
          pacman -U --noconfirm "$package"
          packaging/tests/smoke-installed-package.sh "$(python3 -c 'from vocotype_version import __version__; print(__version__)')"
          pacman -Rns --noconfirm vocotype-linux
          packaging/tests/smoke-removed-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/packages/*.pkg.tar.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-python-deb, rpm, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Consolidate checksums
        run: |
          find assets -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > assets/SHA256SUMS.all
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/**/*
          generate_release_notes: true
