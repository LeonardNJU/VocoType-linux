name: Apply Fcitx async transcription patch

on:
  push:
    branches:
      - fix/fcitx-async-transcription
    paths:
      - .github/workflows/apply-fcitx-async-patch.yml
      - .automation/fcitx-async/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/fcitx-async/chunk-* > /tmp/fcitx-async.patch
          git apply --check /tmp/fcitx-async.patch
          git apply /tmp/fcitx-async.patch
          rm -rf .automation/fcitx-async
          rm .github/workflows/apply-fcitx-async-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make Fcitx transcription cancellable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
