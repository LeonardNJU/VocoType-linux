name: Apply Fcitx async transcription patch

on:
  push:
    branches:
      - fix/fcitx-async-transcription
    paths:
      - .github/workflows/apply-fcitx-async-patch.yml
      - .automation/fcitx-async/**
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/apply-fcitx-async-patch.yml
      - .automation/fcitx-async/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/fcitx-async/chunk-* > /tmp/fcitx-async.patch
          excluded=src/integrations/fcitx5/common/ipc_client.cpp
          git apply --check --exclude="$excluded" /tmp/fcitx-async.patch
          git apply --exclude="$excluded" /tmp/fcitx-async.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/integrations/fcitx5/common/ipc_client.cpp")
          source = path.read_text()
          begin = source.index("TranscribeResult IPCClient::transcribeAudio(")
          end = source.index("VoiceEditResult IPCClient::editAudio(", begin)
          path.write_text(source[:begin] + source[end:])
          PY
          ! rg -q 'transcribeAudio\(' src/integrations/fcitx5/common src/integrations/fcitx5/module
          rm -rf .automation/fcitx-async
          rm .github/workflows/apply-fcitx-async-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: make Fcitx transcription cancellable"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${branch}"
