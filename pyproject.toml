[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocotype-linux"
dynamic = ["version"]
description = "Offline VoCoType voice input method for Linux with IBus and Fcitx 5 support"
keywords = ["voice input", "dictation", "IBus", "Fcitx5", "FunASR"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "VoCoType" }
]
dependencies = [
  "sounddevice==0.5.2",
  "numpy==1.26.4",
  "scipy==1.16.3",
  "soundfile==0.13.1",
  "funasr_onnx==0.4.2",
  "jieba==0.42.1",
  "PyYAML>=6.0,<7",
  "WeTextProcessing==1.2.0",
  "PyGObject>=3.46",
  "modelscope==1.30.0",
]

[project.urls]
Homepage = "https://vocotype-linux.lsamc.website"
Repository = "https://github.com/LeonardNJU/VocoType-linux"
Issues = "https://github.com/LeonardNJU/VocoType-linux/issues"
Changelog = "https://github.com/LeonardNJU/VocoType-linux/blob/master/CHANGELOG.md"

[project.scripts]
vocotype-ibus = "ibus.main:main"
vocotype-download-models = "app.download_models:main"
vocotype-settings = "settings_center.application:main"
vocotype-doctor = "settings_center.doctor:main"

[tool.setuptools]
py-modules = ["vocotype_package", "vocotype_version"]

[tool.setuptools.packages.find]
include = ["app*", "ibus*", "settings_center*"]

[tool.setuptools.data-files]
"share/applications" = ["data/applications/io.github.LeonardNJU.VoCoType.Settings.desktop"]
"share/metainfo" = ["data/metainfo/io.github.LeonardNJU.VoCoType.metainfo.xml"]
"share/icons/hicolor/192x192/apps" = ["site/icon-192.png"]
"share/vocotype" = ["data/terms.yaml", "requirements.txt", "uv.lock"]
"share/vocotype/ibus" = ["ibus/data/vocotype.xml.in"]

[tool.setuptools.dynamic]
version = { attr = "vocotype_version.__version__" }
